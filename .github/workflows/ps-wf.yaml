name: Apigee Platform CI

on:
  push:
    branches:
      - feature-adarsha
      - release

jobs:
  apigee-ci:
    uses: ForgeCrux/pipeline-template/.github/workflows/apigee-v1.yaml@main
    permissions:
      contents: read
      id-token: write

    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      PROB_SERVICE_TOKEN_URL: ${{ secrets.PROB_SERVICE_TOKEN_URL }}
      PROB_SERVICE_TOKEN_CLIENT_ID: ${{ secrets.PROB_SERVICE_TOKEN_CLIENT_ID }}
      PROB_SERVICE_TOKEN_CLIENT_SECRET: ${{ secrets.PROB_SERVICE_TOKEN_CLIENT_SECRET }}
      PROB_SERVICE_TOKEN_TENANT_ID: ${{ secrets.PROB_SERVICE_TOKEN_TENANT_ID }}
      cicd_profile_id: ${{ secrets.CICD_PROFILE_ID }}

    with:
      apigee_org: probestack-nonprod
      apigee_env: development
      deploy_proxy: testing-shared-flow
      resourcetype: sharedflows
      branch_name: ${{ github.ref_name }}
